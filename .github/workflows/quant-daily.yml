name: Daily Quant Pipeline

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after acceptance testing
        required: true
        type: boolean
        default: false
  schedule:
    # Weekdays at 19:47 Malaysia time (11:47 UTC). Scheduled runs scan and publish automatically.
    - cron: "47 11 * * 1-5"

permissions:
  contents: read
  id-token: write

concurrency:
  group: bmk-quant-daily
  cancel-in-progress: false

jobs:
  quant:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: quant-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: quant/pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e 'quant[tradingview]'
      - name: Restore anonymous TradingView history cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/tradingview
          key: bmk-tv-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bmk-tv-${{ runner.os }}-
      - name: Restore quant research, regime, trade, and portfolio history
        uses: actions/cache/restore@v4
        with:
          path: artifacts/quant_history.sqlite
          key: bmk-research-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bmk-research-${{ runner.os }}-
      - name: Validate and score the full Bursa universe
        run: >-
          bmk-quant run
          --source tradingview-free
          --output artifacts/latest
          --history-db artifacts/quant_history.sqlite
          --min-universe 900
          --cache-dir .cache/tradingview
          --bars 400
          --request-delay 0.12
      - name: Save anonymous TradingView history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/tradingview
          key: bmk-tv-${{ runner.os }}-${{ github.run_id }}
      - name: Request short-lived GitHub identity token
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish) ||
          github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=bursa-musangking-quant-terminal")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "${response}")"
          test -n "${token}"
          echo "::add-mask::${token}"
          echo "BMK_INGEST_TOKEN=${token}" >> "${GITHUB_ENV}"
      - name: Publish verified snapshot
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish) ||
          github.event_name == 'schedule'
        env:
          BMK_QUANT_API_BASE: https://bursa-musangking-quant-terminal.yankhaing.chatgpt.site
        run: >-
          bmk-quant publish
          --artifacts artifacts/latest
          --api-base "$BMK_QUANT_API_BASE"
      - name: Save verified quant research, regime, trade, and portfolio history
        if: >-
          always() &&
          ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
          github.event_name == 'schedule') &&
          hashFiles('artifacts/latest/quant-publish-confirmed.json') != ''
        uses: actions/cache/save@v4
        with:
          path: artifacts/quant_history.sqlite
          key: bmk-research-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quant-run-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
