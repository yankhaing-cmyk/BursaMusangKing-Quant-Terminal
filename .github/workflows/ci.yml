name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: quant/pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e quant
      - name: Python unit and full-universe smoke tests
        env:
          BMK_FULL_SMOKE: "1"
        run: python -m unittest discover -s quant/tests -v
      - name: Python syntax gate
        run: python -m compileall -q quant/bmk_quant quant/tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

