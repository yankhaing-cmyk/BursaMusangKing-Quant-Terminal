name: Daily Quant Pipeline

on:
  push:
    branches: [agent/first-shadow-run]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after acceptance testing
        required: true
        type: boolean
        default: false
  schedule:
    # Dormant until ENABLE_SCHEDULED_QUANT=true. Malaysia is UTC+8 year-round.
    - cron: "7 11 * * 1-5"

permissions:
  contents: read

concurrency:
  group: bmk-quant-daily
  cancel-in-progress: false

jobs:
  quant:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULED_QUANT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: quant-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: quant/pyproject.toml
      - run: python -m pip install --upgrade pip && python -m pip install -e 'quant[tradingview]'
      - name: Restore anonymous TradingView history cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/tradingview
          key: bmk-tv-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bmk-tv-${{ runner.os }}-
      - name: Validate and score the full Bursa universe
        run: >-
          bmk-quant run
          --source tradingview-free
          --output artifacts/latest
          --history-db artifacts/quant_history.sqlite
          --min-universe 900
          --cache-dir .cache/tradingview
          --bars 400
          --request-delay 0.12
      - name: Save anonymous TradingView history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/tradingview
          key: bmk-tv-${{ runner.os }}-${{ github.run_id }}
      - name: Publish verified snapshot
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish) ||
          (github.event_name == 'schedule' && vars.ENABLE_LIVE_PUBLISH == 'true')
        env:
          BMK_QUANT_API_BASE: ${{ secrets.BMK_QUANT_API_BASE }}
          BMK_INGEST_TOKEN: ${{ secrets.BMK_INGEST_TOKEN }}
        run: >-
          bmk-quant publish
          --artifacts artifacts/latest
          --api-base "$BMK_QUANT_API_BASE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quant-run-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
